        body {

        }
        .card {
            background: #ffffff;

        h1 {
            margin-top: 0;
            font-size: 22px;
            color: #005f69;
        }
        p {
            color: #555;
            font-size: 14px;
        }
        ul {
            list-style: none;
            padding: 0;
            margin-top: 20px;
        }
        li {
            margin-bottom: 12px;
        }
        a {
            display: block;
            padding: 12px 16px;
            background-color: #005f69;
            color: #ffffff;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            transition: background-color 0.2s;
        }
        a:hover {
            background-color: #00454d;
        }
