<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8" />
    <title>Flappy Bird - jQuery</title>
    <link href="css/style.css" rel="stylesheet" />
</head>
<body>
    <div id="container">
        <div id="bird"></div>
        <div id="pole_1" class="pole"></div>
        <div id="pole_2" class="pole"></div>
        <span id="level">Level 1</span>
        <span id="score">0</span>
        <div id="message"></div>
        <button id="play_btn">Bấm để chơi<br><small>(↓ mũi tên xuống để bay lên)</small></button>
    </div>
    <button id="restart_btn">Chơi lại</button>

    <script src="https://code.jquery.com/jquery-3.1.1.min.js"></script>
    <script>window.jQuery || document.write('<script src="js/jquery.min.js"><\/script>');</script>
    <script src="js/script.js"></script>
</body>
</html>
