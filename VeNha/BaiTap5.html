<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Khoa CNTTKD</title>
  <style>
    /* Tổng thể phần section */
    .best-shared {
      text-align: center; /* Gợi ý i: Căn giữa toàn bộ nội dung */
      max-width: 600px;
      margin: 40px auto;
      font-family: Arial, sans-serif;
      line-height: 1.6;
    }

    /* Logo BIT */
    .best-shared .logo img {
      width: 200px;
      margin-bottom: 10px;
    }

    /* Tiêu đề H2 */
    .best-shared h2 {
      font-size: 28px;
      color: #333;
      margin-bottom: 15px;
    }

    /* Đoạn văn miêu tả */
    .best-shared .lead-text {
      color: #666;
      font-size: 15px;
      margin-bottom: 25px;
    }

    /* Danh sách nút */
    .btn-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    /* Đưa các thẻ li nằm cùng một hàng ngang */
    .btn-list li {
      display: inline-block; /* Gợi ý iii: Đứng cạnh nhau */
      margin: 0 5px;
    }

    /* Định dạng thẻ a thành các nút bấm đẹp mắt */
    .btn-list li a {
      display: inline-block;
      text-decoration: none; /* Gợi ý ii: Bỏ gạch chân thẻ link */
      padding: 10px 24px;
      background-color: #3498db;
      color: #ffffff;
      border-radius: 4px;
      font-weight: bold;
      transition: background-color 0.2s ease-in-out;
    }

    /* Nút thứ 2 (All Features) chuyển sang viền hoặc màu tối hơn cho đẹp */
    .btn-list li:last-child a {
      background-color: #2c3e50;
    }

    /* Hiệu ứng hover */
    .btn-list li a:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>

  <section class="best-shared">
    Phát triển ứng dụng WEB/TMĐT
    <p class="logo">
      <img style="width:200px" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSMecVei2XbVU_TWoeeMc1clxVz2_KTXkgDHRJRDn3A1-DUoawpKhwOChvS&s=10" alt="Logo BIT">
    </p>
    <h2>Best <strong>Shared Hosting</strong> Company</h2>
    <p class="lead-text">With this responsive landing page template, you can promote your all hosting, domain and email services.</p>
    <ul class="btn-list">
      <li><a href="./">View Plans</a></li>
      <li><a href="./">All Features</a></li>
    </ul>
  </section>

</body>
</html>
