<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bài Tập 4 - Horizontal Menu</title>
  <style>
    /* Reset và căn giữa danh sách */
    ul {
      list-style-type: none;
      padding: 0;
      margin: 30px 0;
      text-align: center; /* Căn giữa các thẻ inline-block */
    }

    /* Đưa các thẻ li nằm cùng một hàng ngang và thưa nhau ra */
    ul li {
      display: inline-block;
      margin: 0 4px;
    }

    /* Định dạng nút bấm màu cyan chữ xanh blue đúng hình mẫu */
    ul li a {
      display: inline-block;
      background-color: #00ffff; /* Màu nền xanh cyan */
      color: blue;               /* Chữ màu xanh dương */
      font-family: 'Times New Roman', Times, serif;
      font-size: 22px;
      padding: 6px 20px;
      text-decoration: underline; /* Giữ gạch chân theo mẫu */
    }
  </style>
</head>
<body>

  <!-- HTML gốc của đề bài -->
  <ul>
    <li><a href="#">TMDT</a></li>
    <li><a href="#">ERP</a></li>
    <li><a href="#">MIS</a></li>
    <li><a href="#">DS</a></li>
  </ul>

</body>
</html>
