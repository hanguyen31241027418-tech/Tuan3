<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bài Tập 7 - CSS Layout</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      padding: 30px;
      background-color: #ffffff;
    }

    /* Chữ 'wrapper' nằm trên cùng ngoài khung */
    .label-wrapper {
      width: 450px;
      margin: 0 auto 5px;
      font-size: 18px;
      color: #000;
    }

    /* Khung ngoài cùng */
    #wrapper {
      width: 450px;
      margin: 0 auto;
      border: 2px solid #000;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* Khung Header */
    header {
      border: 2px solid #000;
      height: 60px;
      padding: 8px;
      font-size: 18px;
    }

    /* Khung chứa Nav và Main nằm ngang */
    .content-container {
      display: flex;
      gap: 10px;
    }

    /* Thẻ nav bên trái */
    nav {
      border: 2px solid #000;
      width: 110px;
      height: 280px;
      padding: 8px;
      font-size: 18px;
    }

    /* Thẻ main bên phải */
    main {
      border: 2px solid #000;
      flex: 1;
      height: 280px;
      padding: 8px;
      font-size: 18px;
    }

    /* Khung Footer */
    footer {
      border: 2px solid #000;
      height: 50px;
      padding: 8px;
      font-size: 18px;
    }
  </style>
</head>
<body>

  <!-- Nhãn chữ wrapper phía trên khung -->
  <div class="label-wrapper">wrapper</div>

  <!-- HTML chuẩn theo đề bài 7 -->
  <div id="wrapper">
    <header>header</header>

    <!-- Bao nav và main trong container để đặt nằm ngang cạnh nhau -->
    <div class="content-container">
      <nav>nav</nav>
      <main>main</main>
    </div>

    <footer>footer</footer>
  </div>

</body>
</html>
